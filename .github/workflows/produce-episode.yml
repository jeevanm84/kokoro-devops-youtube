# Weekly: render -> QA -> upload PRIVATE to YouTube -> record video IDs. Publishing stays manual.
# NOT yet run on GitHub: first run it manually (Actions -> produce-episode -> Run workflow).
name: produce-episode
on:
  workflow_dispatch:
    inputs:
      episode: { description: "Episode (blank = next ready entry in episodes/schedule.json)", required: false, default: "" }
      upload:  { description: "Upload to YouTube as PRIVATE after QA passes", type: boolean, default: true }
  schedule:
    - cron: "30 9 * * 1"   # Monday 09:30 UTC = 15:00 IST. GitHub can delay scheduled runs.
concurrency: { group: produce-episode, cancel-in-progress: false }   # never two productions at once
permissions: { contents: read }

jobs:
  select:
    runs-on: ubuntu-24.04
    outputs: { episode: "${{ steps.pick.outputs.episode }}" }
    steps:
      - uses: actions/checkout@v4.2.2
      - id: pick
        env: { INPUT_EP: "${{ github.event.inputs.episode }}" }
        run: |
          EP="$INPUT_EP"
          [ -z "$EP" ] && EP="$(python3 automation/next_episode.py)"
          echo "episode=$EP" >> "$GITHUB_OUTPUT"
          [ -z "$EP" ] && echo "::notice::No episode is ready in episodes/schedule.json - nothing to produce this week." || echo "Producing $EP"

  render:
    needs: select
    if: needs.select.outputs.episode != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env: { EP: "${{ needs.select.outputs.episode }}" }
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-python@v5.3.0
        with: { python-version: "3.12", cache: pip }
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg libcairo2-dev libpango1.0-dev pkg-config fonts-dejavu-core
      - run: pip install -r requirements.txt
      - uses: actions/cache@v4.2.0
        with: { path: assets/models, key: kokoro-v1.0 }
      - uses: actions/cache@v4.2.0
        with: { path: .cache, key: "tts-${{ hashFiles(format('episodes/{0}/script.json', needs.select.outputs.episode)) }}", restore-keys: tts- }
      - run: sh automation/setup_models.sh
      - name: Pipeline (validate, voice, subtitles, render, assemble, Short, thumbnail, metadata, QA)
        env: { SARVAM_API_KEY: "${{ secrets.SARVAM_API_KEY }}" }
        run: python automation/pipeline.py run "$EP"
      - uses: actions/upload-artifact@v4.6.0
        if: always()
        with:
          name: "${{ env.EP }}-package"
          retention-days: 30
          path: |
            episodes/${{ env.EP }}/youtube-video.mp4
            episodes/${{ env.EP }}/youtube-short.mp4
            episodes/${{ env.EP }}/thumbnail.png
            episodes/${{ env.EP }}/metadata.json
            episodes/${{ env.EP }}/qa-report.md
            episodes/${{ env.EP }}/subtitles/

  upload:
    needs: [select, render]
    if: needs.select.outputs.episode != '' && (github.event_name == 'schedule' || github.event.inputs.upload == 'true')
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment: youtube                 # holds the YouTube secrets; add required reviewers here if you want a manual gate
    permissions: { contents: write }     # to commit upload-state.json (prevents duplicate uploads on reruns)
    env: { EP: "${{ needs.select.outputs.episode }}" }
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-python@v5.3.0
        with: { python-version: "3.12" }
      - run: pip install -r requirements-upload.txt
      - uses: actions/download-artifact@v4.2.0
        with: { name: "${{ env.EP }}-package", path: "episodes/${{ env.EP }}" }
      - name: Write YouTube credentials outside the repo
        env: { YT_CLIENT_SECRET_JSON: "${{ secrets.YT_CLIENT_SECRET_JSON }}", YT_TOKEN_JSON: "${{ secrets.YT_TOKEN_JSON }}" }
        run: |
          [ -n "$YT_TOKEN_JSON" ] || { echo "::error::YT_TOKEN_JSON secret missing (see docs/AUTOMATION.md)"; exit 1; }
          mkdir -p ~/.config/kokoro-devops && umask 077
          printf '%s' "$YT_CLIENT_SECRET_JSON" > ~/.config/kokoro-devops/client_secret.json
          printf '%s' "$YT_TOKEN_JSON"         > ~/.config/kokoro-devops/token.json
      - name: Upload PRIVATE (skips anything already uploaded)
        run: python automation/upload_youtube.py "$EP"
      - name: Record video IDs
        if: always()
        run: |
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "episodes/$EP/upload-state.json" 2>/dev/null || true
          git diff --cached --quiet || { git commit -m "chore($EP): record YouTube upload state [skip ci]"; git push; }
